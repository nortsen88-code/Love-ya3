<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Do you love me?</title>
        <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet" />
          <style>
              *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

                  :root {
                        --pink: #ff6b9d;
                              --rose: #ff3d7a;
                                    --soft: #ffe0ec;
                                          --cream: #fff5f8;
                                                --dark: #5c1a33;
                                                    }

                                                        body {
                                                              min-height: 100vh;
                                                                    background: var(--cream);
                                                                          display: flex;
                                                                                align-items: center;
                                                                                      justify-content: center;
                                                                                            font-family: 'Quicksand', sans-serif;
                                                                                                  overflow: hidden;
                                                                                                        position: relative;
                                                                                                            }

                                                                                                                /* floating hearts background */
                                                                                                                    .hearts-bg {
                                                                                                                          position: fixed;
                                                                                                                                inset: 0;
                                                                                                                                      pointer-events: none;
                                                                                                                                            z-index: 0;
                                                                                                                                                }
                                                                                                                                                    .heart-float {
                                                                                                                                                          position: absolute;
                                                                                                                                                                bottom: -60px;
                                                                                                                                                                      font-size: 1.4rem;
                                                                                                                                                                            opacity: 0;
                                                                                                                                                                                  animation: floatUp linear infinite;
                                                                                                                                                                                      }
                                                                                                                                                                                          @keyframes floatUp {
                                                                                                                                                                                                0%   { transform: translateY(0) rotate(-15deg); opacity: 0; }
                                                                                                                                                                                                      10%  { opacity: 0.6; }
                                                                                                                                                                                                            90%  { opacity: 0.4; }
                                                                                                                                                                                                                  100% { transform: translateY(-110vh) rotate(15deg); opacity: 0; }
                                                                                                                                                                                                                      }

                                                                                                                                                                                                                          .card {
                                                                                                                                                                                                                                position: relative;
                                                                                                                                                                                                                                      z-index: 1;
                                                                                                                                                                                                                                            background: white;
                                                                                                                                                                                                                                                  border-radius: 32px;
                                                                                                                                                                                                                                                        padding: 60px 50px 50px;
                                                                                                                                                                                                                                                              text-align: center;
                                                                                                                                                                                                                                                                    box-shadow: 0 20px 60px rgba(255,61,122,0.18), 0 4px 16px rgba(255,61,122,0.1);
                                                                                                                                                                                                                                                                          max-width: 440px;
                                                                                                                                                                                                                                                                                width: 90vw;
                                                                                                                                                                                                                                                                                      animation: cardIn 0.7s cubic-bezier(.34,1.56,.64,1) both;
                                                                                                                                                                                                                                                                                          }
                                                                                                                                                                                                                                                                                              @keyframes cardIn {
                                                                                                                                                                                                                                                                                                    from { opacity:0; transform: scale(0.8) translateY(30px); }
                                                                                                                                                                                                                                                                                                          to   { opacity:1; transform: scale(1) translateY(0); }
                                                                                                                                                                                                                                                                                                              }

                                                                                                                                                                                                                                                                                                                  .emoji-top {
                                                                                                                                                                                                                                                                                                                        font-size: 3.2rem;
                                                                                                                                                                                                                                                                                                                              display: block;
                                                                                                                                                                                                                                                                                                                                    margin-bottom: 16px;
                                                                                                                                                                                                                                                                                                                                          animation: wobble 2s ease-in-out infinite;
                                                                                                                                                                                                                                                                                                                                              }
                                                                                                                                                                                                                                                                                                                                                  @keyframes wobble {
                                                                                                                                                                                                                                                                                                                                                        0%,100% { transform: rotate(-8deg) scale(1); }
                                                                                                                                                                                                                                                                                                                                                              50%      { transform: rotate(8deg) scale(1.12); }
                                                                                                                                                                                                                                                                                                                                                                  }

                                                                                                                                                                                                                                                                                                                                                                      h1 {
                                                                                                                                                                                                                                                                                                                                                                            font-family: 'Pacifico', cursive;
                                                                                                                                                                                                                                                                                                                                                                                  font-size: clamp(2.4rem, 8vw, 3.4rem);
                                                                                                                                                                                                                                                                                                                                                                                        color: var(--rose);
                                                                                                                                                                                                                                                                                                                                                                                              letter-spacing: 1px;
                                                                                                                                                                                                                                                                                                                                                                                                    line-height: 1.1;
                                                                                                                                                                                                                                                                                                                                                                                                          margin-bottom: 10px;
                                                                                                                                                                                                                                                                                                                                                                                                                text-shadow: 3px 3px 0 rgba(255,61,122,0.15);
                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                        .subtitle {
                                                                                                                                                                                                                                                                                                                                                                                                                              color: #c06080;
                                                                                                                                                                                                                                                                                                                                                                                                                                    font-size: 0.95rem;
                                                                                                                                                                                                                                                                                                                                                                                                                                          margin-bottom: 40px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                font-weight: 600;
                                                                                                                                                                                                                                                                                                                                                                                                                                                      opacity: 0.8;
                                                                                                                                                                                                                                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                                                                                                                                                                                                                                              .buttons {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    display: flex;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                          gap: 18px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                justify-content: center;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      align-items: center;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            flex-wrap: wrap;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  min-height: 80px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          button {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                font-family: 'Quicksand', sans-serif;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      font-weight: 700;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            border: none;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  border-radius: 50px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        cursor: pointer;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              transition: transform 0.15s, box-shadow 0.15s;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    line-height: 1;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          white-space: nowrap;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  button:active { transform: scale(0.94) !important; }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      #yesBtn {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            background: linear-gradient(135deg, #ff6b9d, #ff3d7a);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  color: white;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        padding: 16px 36px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              font-size: 1.15rem;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    box-shadow: 0 6px 20px rgba(255,61,122,0.4);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          transition: transform 0.4s cubic-bezier(.34,1.56,.64,1), font-size 0.4s, padding 0.4s, box-shadow 0.3s;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  #yesBtn:hover {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        box-shadow: 0 10px 30px rgba(255,61,122,0.5);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              transform: translateY(-3px) scale(1.05);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      #noBtn {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            background: var(--soft);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  color: #c06080;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        padding: 12px 26px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              font-size: 1rem;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    box-shadow: 0 4px 12px rgba(255,107,157,0.15);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          transition: transform 0.2s, box-shadow 0.2s, font-size 0.4s, padding 0.4s;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  #noBtn:hover {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        box-shadow: 0 6px 18px rgba(255,107,157,0.22);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              transform: translateY(-2px);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      /* celebration screen */
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          #celebration {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                display: none;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      flex-direction: column;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            align-items: center;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  gap: 18px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          #celebration .big-emoji { font-size: 5rem; animation: pop 0.6s cubic-bezier(.34,1.56,.64,1) both; }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              @keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  #celebration h2 {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        font-family: 'Pacifico', cursive;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              font-size: clamp(1.5rem, 6vw, 2.2rem);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    color: var(--rose);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          text-shadow: 2px 2px 0 rgba(255,61,122,0.15);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                animation: pop 0.6s 0.15s cubic-bezier(.34,1.56,.64,1) both;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        #celebration p {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              color: #c06080;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    font-size: 1rem;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          font-weight: 600;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                animation: pop 0.6s 0.3s cubic-bezier(.34,1.56,.64,1) both;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        #confetti-canvas {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              position: fixed;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    inset: 0;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          pointer-events: none;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                z-index: 10;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      </style>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      </head>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <body>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <div class="hearts-bg" id="heartsBg"></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <canvas id="confetti-canvas"></canvas>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <div class="card" id="mainCard">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div id="question-area">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <span class="emoji-top">🌸</span>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <h1>Do you love me?</h1>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <p class="subtitle">think VERY carefully 💅</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="buttons">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <button id="yesBtn" onclick="onYes()">Yes obviously 💖</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <button id="noBtn" onclick="onNo()">No 😶</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>
